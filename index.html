<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study page test</title>
<style>
  :root { --bg:#fafafa; --fg:#1b1b1f; --mut:#62626b; --line:#d7d7de; --acc:#3b5bdb; --ok:#2b8a3e; --warn:#c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16161a; --fg:#ececf1; --mut:#a0a0ab; --line:#33333b; --acc:#8da2fb; --ok:#69db7c; --warn:#ffa94d; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 4px 0 10px; }
  .tips { font-size: 13px; color: var(--mut); border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin-bottom:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0; }
  input[type=text] { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; min-width:220px; }
  button { font:inherit; padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; cursor:pointer; }
  button.primary { border-color:var(--acc); color:var(--acc); }
  button.sel { background:var(--acc); color:#fff; border-color:var(--acc); }
  button:disabled { opacity:.45; cursor:default; }
  img { max-width:100%; height:auto; border:1px solid var(--line); border-radius:8px; display:block; }
  #status { font-size:13px; }
  .ok { color:var(--ok); } .warn { color:var(--warn); }
  pre { font-size:12px; white-space:pre-wrap; word-break:break-all; border:1px solid var(--line); border-radius:8px; padding:8px; max-height:180px; overflow:auto; }
  .hide { display:none; }
</style>
</head>
<body>
<main>
  <h1>Study page test <span id="where" style="font-weight:400;color:var(--mut);font-size:13px"></span></h1>
  <div class="tips">This page only tests saving. Type a name, answer the three items, and check that each answer appears in the sheet (tab "test_page").</div>

  <section id="start">
    <div class="row"><label for="name">Name</label><input id="name" type="text" autocomplete="off" placeholder="Your name"><button id="go" class="primary">Start</button></div>
  </section>

  <section id="trial" class="hide">
    <div class="row"><b id="pos"></b><span id="status"></span></div>
    <img id="img" alt="item">
    <div class="row" id="answers">
      <span>Ghosting visible?</span>
      <button data-a="no">No</button><button data-a="unsure">Unsure</button><button data-a="yes">Yes</button>
    </div>
    <div class="row">
      <button id="back">Back</button><button id="next" class="primary">Next</button>
      <button id="resend">Send unsent answers</button><button id="dl">Download my answers</button>
    </div>
    <pre id="log"></pre>
  </section>
</main>
<script src="config.js"></script>
<script>
(function () {
  "use strict";
  var C = window.STUDY_CONFIG || {ITEMS: []};
  var KEY = "study_" + (C.STUDY || "x");
  var $ = function (id) { return document.getElementById(id); };
  var state = load() || {rid: Math.random().toString(36).slice(2, 10), name: "", i: 0, answers: {}, queue: []};
  var sending = false;

  function load() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function log(s) { var el = $("log"); el.textContent = new Date().toISOString().slice(11, 19) + "  " + s + "\n" + el.textContent; }

  function showStatus() {
    var n = state.queue.length, el = $("status");
    if (!C.ENDPOINT_URL) { el.textContent = "no endpoint configured: answers stay in this browser"; el.className = "warn"; }
    else if (n === 0) { el.textContent = "all answers saved"; el.className = "ok"; }
    else { el.textContent = n + " answer" + (n > 1 ? "s" : "") + " not yet sent"; el.className = "warn"; }
  }

  function post(rows, mode) {
    var body = JSON.stringify({secret: C.ENDPOINT_SECRET, study: C.STUDY, rater: state.name + " [" + state.rid + "]", rows: rows});
    var opt = {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: body, redirect: "follow"};
    if (mode) opt.mode = mode;
    return fetch(C.ENDPOINT_URL, opt);
  }

  function flush() {
    if (!C.ENDPOINT_URL || sending || state.queue.length === 0) { showStatus(); return; }
    sending = true;
    var rows = state.queue.slice();
    post(rows).then(function (r) { return r.text(); }).then(function (t) {
      var ok = false; try { ok = JSON.parse(t).ok === true; } catch (e) {}
      if (!ok) { var e2 = new Error("endpoint refused: " + t.slice(0, 120)); e2.refused = true; throw e2; }
      log("sent " + rows.length + " row(s), confirmed by the endpoint");
      return true;
    }).catch(function (err) {
      if (err && err.refused) throw err;
      log("confirmed send failed (" + err.message + "); retrying without reading the reply");
      return post(rows, "no-cors").then(function () { log("sent " + rows.length + " row(s), reply not readable (unconfirmed)"); return true; });
    }).then(function () {
      var ids = {}; rows.forEach(function (r) { ids[r.id + "|" + r.t] = 1; });
      state.queue = state.queue.filter(function (r) { return !ids[r.id + "|" + r.t]; });
      save();
    }).catch(function (err) {
      log("send failed, kept for retry: " + err.message);
    }).then(function () { sending = false; showStatus(); });
  }

  function render() {
    var it = C.ITEMS[state.i];
    $("pos").textContent = "Item " + (state.i + 1) + " of " + C.ITEMS.length;
    $("img").src = it.file;
    var cur = state.answers[it.id] ? state.answers[it.id].answer : null;
    Array.prototype.forEach.call(document.querySelectorAll("#answers button"), function (b) {
      b.className = b.getAttribute("data-a") === cur ? "sel" : "";
    });
    $("back").disabled = state.i === 0;
    $("next").textContent = state.i === C.ITEMS.length - 1 ? "Finish" : "Next";
    showStatus();
  }

  function answer(a) {
    var it = C.ITEMS[state.i];
    var row = {id: it.id, answer: a, t: new Date().toISOString(), ua: navigator.userAgent.slice(0, 80)};
    state.answers[it.id] = row; state.queue.push(row); save(); render(); flush();
  }

  function download() {
    var blob = new Blob([JSON.stringify({study: C.STUDY, rater: state.name, rid: state.rid, answers: state.answers}, null, 1)], {type: "application/json"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = (C.STUDY || "study") + "_" + (state.name || "rater").replace(/[^A-Za-z0-9_-]/g, "_") + "_" + state.rid + ".json";
    document.body.appendChild(a); a.click(); a.remove();
  }

  function start() {
    var n = $("name").value.trim();
    if (!n) { $("name").focus(); return; }
    state.name = n; save();
    $("start").className = "hide"; $("trial").className = "";
    render(); flush();
  }

  $("where").textContent = "(" + location.host + ")";
  $("name").value = state.name || "";
  $("go").onclick = start;
  $("name").onkeydown = function (e) { if (e.key === "Enter") start(); };
  Array.prototype.forEach.call(document.querySelectorAll("#answers button"), function (b) {
    b.onclick = function () { answer(b.getAttribute("data-a")); };
  });
  $("back").onclick = function () { if (state.i > 0) { state.i--; save(); render(); } };
  $("next").onclick = function () {
    if (state.i < C.ITEMS.length - 1) { state.i++; save(); render(); }
    else { log("finished: " + Object.keys(state.answers).length + " of " + C.ITEMS.length + " items answered"); flush(); }
  };
  $("resend").onclick = flush;
  $("dl").onclick = download;
  window.addEventListener("online", flush);
})();
</script>
</body>
</html>
